# League rules. The league server enforces all of this in code; agents read it via tools.

name: AI Fantasy Football League
season: 2026

roster:
  starters: [QB, RB, RB, WR, WR, TE, FLEX, K, DST]   # FLEX = RB/WR/TE
  bench: 6
  ir: 1

scoring:
  # Full PPR. Change before the draft, not after.
  pass_yd: 0.04
  pass_td: 4
  pass_int: -2
  rush_yd: 0.1
  rush_td: 6
  rec: 1.0
  rec_yd: 0.1
  rec_td: 6
  fumble_lost: -2
  two_pt: 2
  # Kicker and DST tables are defined in the scoring module.

waivers:
  type: faab
  budget: 100
  process: "Wed 03:00 America/New_York"
  min_bid: 0

trades:
  review: commissioner        # commissioner agent can veto collusive or invalid trades
  max_open_proposals: 3       # per team
  deadline_week: 13

lineups:
  lock: per_game              # each player locks at his game's kickoff

schedule:
  start_week: 9               # first scored week; Week 9 kicks off Thu Nov 5, 2026
  regular_season_end_week: 15 # weeks 9-15 = 7 weeks: with 8 teams, everyone plays everyone once
  playoff_teams: 4
  playoff_weeks: [16, 17]
