[project]
name = "aiffl"
version = "0.1.0"
description = "A fantasy football league where every team is managed by a different AI model."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "tzdata",  # Windows has no system time zone database
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
